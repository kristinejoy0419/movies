<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" role="img" aria-label="Gremlin">
  <!-- An original little gremlin: big bat ears, glowing eyes, toothy grin. -->
  <defs>
    <radialGradient id="skin" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#8fe07a"/>
      <stop offset="1" stop-color="#3f9a4a"/>
    </radialGradient>
    <radialGradient id="eye" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fff7a8"/>
      <stop offset="1" stop-color="#f5b81c"/>
    </radialGradient>
  </defs>
  <!-- ears -->
  <path d="M38 44 C22 30 8 22 2 26 C8 34 12 48 30 60 Z" fill="url(#skin)" stroke="#1f4d26" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M33 46 C22 38 14 33 10 33 C15 40 19 47 31 55 Z" fill="#e98aa0"/>
  <path d="M82 44 C98 30 112 22 118 26 C112 34 108 48 90 60 Z" fill="url(#skin)" stroke="#1f4d26" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M87 46 C98 38 106 33 110 33 C105 40 101 47 89 55 Z" fill="#e98aa0"/>
  <!-- head -->
  <path d="M60 18 C82 18 92 36 92 56 C92 80 78 94 60 94 C42 94 28 80 28 56 C28 36 38 18 60 18 Z" fill="url(#skin)" stroke="#1f4d26" stroke-width="2.5"/>
  <!-- tuft and spikes -->
  <path d="M52 20 L56 8 L60 18 L66 6 L68 20" fill="#3f9a4a" stroke="#1f4d26" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- brows -->
  <path d="M38 42 L54 48" stroke="#1f4d26" stroke-width="4" stroke-linecap="round"/>
  <path d="M82 42 L66 48" stroke="#1f4d26" stroke-width="4" stroke-linecap="round"/>
  <!-- eyes -->
  <ellipse cx="47" cy="55" rx="9" ry="8" fill="url(#eye)" stroke="#1f4d26" stroke-width="2"/>
  <ellipse cx="73" cy="55" rx="9" ry="8" fill="url(#eye)" stroke="#1f4d26" stroke-width="2"/>
  <ellipse cx="48" cy="56" rx="2.2" ry="6" fill="#2a0f0f"/>
  <ellipse cx="72" cy="56" rx="2.2" ry="6" fill="#2a0f0f"/>
  <!-- nose -->
  <path d="M56 66 Q60 70 64 66" fill="none" stroke="#1f4d26" stroke-width="2.5" stroke-linecap="round"/>
  <!-- grin with teeth -->
  <path d="M40 74 Q60 90 80 74 Q60 82 40 74 Z" fill="#5a1220" stroke="#1f4d26" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M44 76 L47 81 L50 78 L53 83 L56 79 L60 84 L64 79 L67 83 L70 78 L73 81 L76 76" fill="#fffbe8" stroke="#1f4d26" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
